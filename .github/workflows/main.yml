name: Host ECSRev on Windows with Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: ecsrev-host
  cancel-in-progress: true

jobs:
  host-ecsrev:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ecsrev
      PGHOST: 127.0.0.1
      DATA_DIR: .ecsrev-data
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ASPNETCORE_URLS: http://127.0.0.1:5000
      SITE_AUTH: gha-local-auth

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Require admin password secret
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ADMIN_PASSWORD)) {
            throw "Add repo secret ADMIN_PASSWORD (Settings > Secrets and variables > Actions)."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.18'

      - name: Restore persisted data cache
        uses: actions/cache@v4
        with:
          path: .ecsrev-data
          key: ecsrev-data-v2-${{ github.run_id }}
          restore-keys: |
            ecsrev-data-v2-

      - name: Cache PostgreSQL binaries
        id: pg-cache
        uses: actions/cache@v4
        with:
          path: C:\\Program Files\\PostgreSQL\\15
          key: postgresql-15.19-win64-v1

      - name: Folders + restore files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:DATA_DIR | Out-Null
          foreach ($d in @(
            "services\\api\\public",
            "services\\api\\public\\images\\thumbnails",
            "services\\api\\public\\images\\groups",
            "services\\api\\public\\UnsecuredContent",
            "services\\api\\storage\\asset"
          )) { New-Item -ItemType Directory -Force -Path $d | Out-Null }
          function Restore-Tree($fromRel, $toRel) {
            $from = Join-Path $env:DATA_DIR $fromRel
            if (Test-Path $from) {
              New-Item -ItemType Directory -Force -Path $toRel | Out-Null
              & robocopy $from $toRel /E /NFL /NDL /NJH /NJS /nc /ns /np | Out-Null
            }
          }
          Restore-Tree "files\\api-public" "services\\api\\public"
          Restore-Tree "files\\api-storage" "services\\api\\storage"

      - name: PostgreSQL
        shell: powershell
        run: |
          $pgRoot = "C:\\Program Files\\PostgreSQL\\15"
          $pgBin = Join-Path $pgRoot "bin"
          $pgData = Join-Path $pgRoot "data"
          if ("${{ steps.pg-cache.outputs.cache-hit }}" -ne "true") {
            choco install postgresql15 --params "/Password:postgres" -y --no-progress
          }
          if (-not (Test-Path (Join-Path $pgBin "pg_ctl.exe"))) { throw "PostgreSQL missing" }
          Add-Content -Path $env:GITHUB_PATH -Value $pgBin
          $env:Path = "$pgBin;" + $env:Path
          $svc = Get-Service -Name "postgresql*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($svc) {
            if ($svc.Status -ne "Running") { Start-Service $svc.Name }
          } else {
            if (-not (Test-Path $pgData)) { & "$pgBin\\initdb.exe" -D $pgData -U postgres --auth=trust --encoding=UTF8 }
            & "$pgBin\\pg_ctl.exe" -D $pgData -l (Join-Path $pgRoot "pg.log") start
          }
          $ready = $false
          for ($i = 0; $i -lt 40; $i++) {
            & "$pgBin\\pg_isready.exe" -h 127.0.0.1 -U postgres | Out-Null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { throw "PostgreSQL did not become ready" }
          & "$pgBin\\createdb.exe" -U postgres -h 127.0.0.1 ecsrev 2>$null

      - name: Redis
        shell: powershell
        run: |
          choco install memurai-developer -y --no-progress
          $m = Get-Command memurai.exe -ErrorAction SilentlyContinue
          if ($m) { Start-Process $m.Source } else {
            $r = Get-Command redis-server.exe -ErrorAction SilentlyContinue
            if ($r) { Start-Process $r.Source }
          }

      - name: Restore database dump if present
        shell: powershell
        run: |
          $dump = Join-Path $env:DATA_DIR "ecsrev.dump"
          $sql  = Join-Path $env:DATA_DIR "ecsrev.sql"
          if (Test-Path $dump) {
            & pg_restore -h 127.0.0.1 -U postgres -d ecsrev --clean --if-exists --no-owner --no-acl $dump
          } elseif (Test-Path $sql) {
            & psql -h 127.0.0.1 -U postgres -d ecsrev -f $sql
          }

      - name: services/api/config.json
        shell: powershell
        working-directory: ./services/api
        run: Set-Content -Path "config.json" -Value '{"knex":{"client":"pg","connection":{"host":"127.0.0.1","user":"postgres","password":"postgres","database":"ecsrev"}}}'

      - name: npm i + knex migrate
        shell: powershell
        working-directory: ./services/api
        run: |
          npm install --no-audit --no-fund
          npx knex migrate:latest

      - name: appsettings.json
        shell: powershell
        working-directory: ./services/Roblox/Roblox.Website
        run: |
          $root = $env:GITHUB_WORKSPACE.Replace('\','\\')
          @"
          {
            "Urls": "http://127.0.0.1:5000",
            "Logging": { "LogLevel": { "Default": "Warning", "Microsoft.AspNetCore": "Warning" } },
            "Twitter": { "ApiKey": "x", "ApiKeySecret": "x", "Bearer": "x" },
            "PackageShirtAssetId": -1,
            "PackagePantsAssetId": -1,
            "PackageLeftArmAssetId": -1,
            "PackageRightArmAssetId": -1,
            "PackageLeftLegAssetId": -1,
            "PackageRightLegAssetId": -1,
            "PackageTorsoAssetId": -1,
            "SignupAssetIds": [],
            "SignupAvatarAssetIds": [],
            "CdnBaseUrl": "",
            "BaseUrl": "http://127.0.0.1:5000",
            "Authorization": "$env:SITE_AUTH",
            "Postgres": "Host=127.0.0.1; Database=ecsrev; Password=postgres; Username=postgres; Maximum Pool Size=20",
            "Redis": "127.0.0.1",
            "AssetValidation": { "BaseUrl": "http://127.0.0.1:4300", "Authorization": "$env:SITE_AUTH" },
            "Render": { "BaseUrl": "ws://127.0.0.1:3189", "Authorization": "$env:SITE_AUTH" },
            "GameServerAuthorization": "$env:SITE_AUTH",
            "OwnerUserId": "1",
            "HCaptcha": { "Public": "10000000-ffff-ffff-ffff-000000000001", "Private": "0x0000000000000000000000000000000000000000" },
            "BotAuthorization": "$env:SITE_AUTH",
            "RccAuthorization": "$env:SITE_AUTH",
            "Directories": {
              "Storage": "$root\\services\\api\\storage\\",
              "Asset": "$root\\services\\api\\storage\\asset\\",
              "Public": "$root\\services\\api\\public\\",
              "Thumbnails": "$root\\services\\api\\public\\images\\thumbnails\\",
              "GroupIcons": "$root\\services\\api\\public\\images\\groups\\",
              "XmlTemplates": "$root\\services\\Roblox\\Roblox.Libraries\\Templates\\",
              "JsonData": "$root\\services\\Roblox\\Roblox.Libraries\\Json\\",
              "AdminBundle": "$root\\services\\admin\\public\\",
              "EconomyChatBundle": "$root\\services\\economy-chat\\build\\"
            },
            "Jwt": { "Sessions": "gha-jwt-sessions-key-change-me-please-32ch" },
            "AllowedHosts": "*"
          }
          "@ | Set-Content -Path "appsettings.json"

      - name: Auto-accept applications
        shell: powershell
        run: |
          $file = "services\\Roblox\\Roblox.Services\\Users\\ApplicationProcessorService.cs"
          if (Test-Path $file) {
            $content = Get-Content $file -Raw
            $patched = $content -replace "autoAccept\\s*=\\s*false", "autoAccept = true"
            if ($patched -eq $content) { $patched = $content -replace "AutoAccept\\s*=\\s*false", "AutoAccept = true" }
            Set-Content -Path $file -Value $patched -NoNewline
          }

      - name: Build admin panel
        shell: powershell
        working-directory: ./services/admin
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build frontend
        shell: powershell
        working-directory: ./services/2016-roblox-main
        run: |
          Set-Content -Path "config.json" -Value '{"serverRuntimeConfig":{"backend":{"csrfKey":"gha-frontend-csrf-key"}},"publicRuntimeConfig":{"backend":{"proxyEnabled":true,"flags":{"myAccountPage2016Enabled":true,"catalogGenreFilterSupported":true,"catalogPageLimit":28,"catalogSaleCountVisibleFromDetailsEndpoint":true,"catalogDetailsPageResellerLimit":10,"avatarPageInventoryLimit":10},"baseUrl":"http://127.0.0.1:5000","apiFormat":"{1}"}}}'
          $js = @"
          import axios from 'axios';
          import config from '../lib/config';
          let _csrf = '';
          const getBaseUrl = () => {
            if (typeof window !== 'undefined' && window.location && window.location.origin) return window.location.origin;
            return 'http://127.0.0.1:5000';
          };
          const getFullUrl = (apiSite, fullUrl) => getBaseUrl() + fullUrl;
          const getUrlWithProxy = (url) => url;
          const request = async (method, url, data) => {
            const isBrowser = typeof window !== 'undefined';
            try {
              let headers = { 'x-csrf-token': _csrf };
              return await axios.request({ method, url: getUrlWithProxy(url), data, headers, maxRedirects: 0 });
            } catch (e) {
              if (e.response && e.response.status === 403 && e.response.headers['x-csrf-token']) {
                _csrf = e.response.headers['x-csrf-token'];
                return await request(method, url, data);
              }
              throw e;
            }
          };
          export default request;
          export { getFullUrl, getBaseUrl, getUrlWithProxy };
          "@
          Set-Content -Path "lib\\request.js" -Value $js
          npm install --no-audit --no-fund
          npm run build
          $log = Join-Path $env:RUNNER_TEMP "next-start.log"
          Start-Process -FilePath "npm" -ArgumentList "run","start","--","-p","3000" -WorkingDirectory (Get-Location).Path -RedirectStandardOutput $log -RedirectStandardError $log
          $up = $false
          for ($i = 0; $i -lt 40; $i++) {
            try { Invoke-WebRequest -Uri "http://127.0.0.1:3000" -UseBasicParsing -TimeoutSec 2 | Out-Null; $up = $true; break } catch { Start-Sleep -Seconds 3 }
          }
          if ($up) { Write-Host "Next.js is up on :3000" } else { if (Test-Path $log) { Get-Content $log }; throw "2016 frontend is not running" }

      - name: Start background data saver
        shell: powershell
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP "save-data.ps1"
          @'
          $ErrorActionPreference = "Continue"
          $root = $env:GITHUB_WORKSPACE
          $dataDir = Join-Path $root ".ecsrev-data"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          function Save-All {
            try {
              & pg_dump -h 127.0.0.1 -U postgres -d ecsrev -Fc -f (Join-Path $dataDir "ecsrev.dump")
              & pg_dump -h 127.0.0.1 -U postgres -d ecsrev -f (Join-Path $dataDir "ecsrev.sql")
            } catch {}
          }
          Save-All
          while ($true) { Start-Sleep -Seconds 60; Save-All }
          '@ | Set-Content -Path $scriptPath -Encoding ascii
          Start-Process powershell.exe -ArgumentList "-NoProfile","-ExecutionPolicy","Bypass","-File",$scriptPath -WindowStyle Hidden

      - name: AssetValidationService
        shell: powershell
        working-directory: ./services/AssetValidationServiceV2
        run: |
          if (Test-Path "main.go") { Start-Process -FilePath "go" -ArgumentList "run","main.go" }

      - name: RCCService
        shell: powershell
        working-directory: ./services/RCCService
        run: |
          if (Test-Path "RCCService.exe") { Start-Process -FilePath ".\\RCCService.exe" -ArgumentList "-console","-placeid:1818" }

      - name: game-server
        shell: powershell
        run: |
          $gs = "services\\game-server"
          if (-not (Test-Path $gs)) { return }
          $rcc = Join-Path $env:GITHUB_WORKSPACE "services\\RCCService\\RCCService.exe"
          Set-Content -Path (Join-Path $gs "config.json") -Value ('{"rcc":"' + $rcc.Replace('\','\\') + '","authorization":"' + $env:SITE_AUTH + '","baseUrl":"http://127.0.0.1:5000","rccPort":64989,"port":3040,"websiteBotAuth":"' + $env:SITE_AUTH + '","thumbnailWebsocketPort":3189,"dockerDisabled":true}')
          Push-Location $gs
          npm install --no-audit --no-fund
          npm run build
          Start-Process -FilePath "npm" -ArgumentList "run","start" -WorkingDirectory (Get-Location).Path
          Pop-Location

      - name: dotnet run website
        shell: powershell
        working-directory: ./services/Roblox/Roblox.Website
        run: |
          $env:ASPNETCORE_URLS = "http://127.0.0.1:5000"
          Start-Process -FilePath "dotnet" -ArgumentList "run"
          $up = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { Invoke-WebRequest -Uri "http://127.0.0.1:5000" -UseBasicParsing -TimeoutSec 2 | Out-Null; $up = $true; break } catch { Start-Sleep -Seconds 2 }
          }
          if ($up) { Write-Host "Website is up on :5000" } else { Write-Host "WARNING: website not answering yet" }

      - name: Install cloudflared
        shell: powershell
        run: choco install cloudflared -y --no-progress

      - name: Cloudflare tunnel (keep this step running)
        shell: powershell
        run: |
          Write-Host "Copy the trycloudflare.com URL from the box below"
          Write-Host "Apply at /auth/application then log in"
          Write-Host "Leave this step running or Error 1033 comes back"
          cloudflared tunnel --url http://127.0.0.1:5000 --no-autoupdate
