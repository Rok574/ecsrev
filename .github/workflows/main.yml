name: Host ECSRev on Windows with Cloudflare[span_0](start_span)[span_0](end_span)

on:
  workflow_dispatch:[span_1](start_span)[span_1](end_span)

concurrency:
  group: ecsrev-host[span_2](start_span)[span_2](end_span)
  cancel-in-progress: true[span_3](start_span)[span_3](end_span)

jobs:
  host-ecsrev:
    runs-on: windows-latest[span_4](start_span)[span_4](end_span)
    timeout-minutes: 360[span_5](start_span)[span_5](end_span)

    env:
      PGUSER: postgres[span_6](start_span)[span_6](end_span)
      PGPASSWORD: postgres[span_7](start_span)[span_7](end_span)
      PGDATABASE: ecsrev[span_8](start_span)[span_8](end_span)
      PGHOST: 127.0.0.1[span_9](start_span)[span_9](end_span)
      DATA_DIR: .ecsrev-data[span_10](start_span)[span_10](end_span)
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}[span_11](start_span)[span_11](end_span)
      ASPNETCORE_URLS: http://127.0.0.1:5000[span_12](start_span)[span_12](end_span)
      SITE_AUTH: gha-local-auth[span_13](start_span)[span_13](end_span)

    steps:
      - name: Checkout Repository[span_14](start_span)[span_14](end_span)
        uses: actions/checkout@v4[span_15](start_span)[span_15](end_span)

      - name: Require admin password secret[span_16](start_span)[span_16](end_span)
        shell: powershell[span_17](start_span)[span_17](end_span)
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ADMIN_PASSWORD)) {
            throw "Add repo secret ADMIN_PASSWORD (Settings > Secrets and variables > Actions)."
          }
          Write-Host "ADMIN_PASSWORD secret is set.[span_18](start_span)"[span_18](end_span)

      - name: Setup .NET[span_19](start_span)[span_19](end_span)
        uses: actions/setup-dotnet@v4[span_20](start_span)[span_20](end_span)
        with:
          dotnet-version: '6.0.x[span_21](start_span)'[span_21](end_span)

      - name: Setup Node.js[span_22](start_span)[span_22](end_span)
        uses: actions/setup-node@v4[span_23](start_span)[span_23](end_span)
        with:
          node-version: '18[span_24](start_span)'[span_24](end_span)

      - name: Setup Go[span_25](start_span)[span_25](end_span)
        uses: actions/setup-go@v5[span_26](start_span)[span_26](end_span)
        with:
          go-version: '1.18[span_27](start_span)'[span_27](end_span)

      - name: Restore persisted data cache[span_28](start_span)[span_28](end_span)
        uses: actions/cache@v4[span_29](start_span)[span_29](end_span)
        with:
          path: .ecsrev-data[span_30](start_span)[span_30](end_span)
          key: ecsrev-data-v1-${{ github.run_id }}[span_31](start_span)[span_31](end_span)
          restore-keys: |
            ecsrev-data-v1-[span_32](start_span)[span_32](end_span)

      - name: Cache PostgreSQL binaries[span_33](start_span)[span_33](end_span)
        id: pg-cache[span_34](start_span)[span_34](end_span)
        uses: actions/cache@v4[span_35](start_span)[span_35](end_span)
        with:
          path: C:\Program Files\PostgreSQL\15[span_36](start_span)[span_36](end_span)
          key: postgresql-15.19-win64-v1[span_37](start_span)[span_37](end_span)

      - name: Step 1 - folders + restore files[span_38](start_span)[span_38](end_span)
        shell: powershell[span_39](start_span)[span_39](end_span)
        run: |
          New-Item -ItemType Directory -Force -Path $env:DATA_DIR | Out-Null
          $dirs = @(
            "services\api\public",
            "services\api\public\images\thumbnails",
            "services\api\public\images\groups",
            "services\api\public\UnsecuredContent",
            "services\api\storage\asset"
          )
          foreach ($d in $dirs) { New-Item -ItemType Directory -Force -Path $d | Out-Null }

          function Restore-Tree($fromRel, $toRel) {
            $from = Join-Path $env:DATA_DIR $fromRel
            if (Test-Path $from) {
              New-Item -ItemType Directory -Force -Path $toRel | Out-Null
              Write-Host "Restoring $fromRel"
              & robocopy $from $toRel /E /NFL /NDL /NJH /NJS /nc /ns /np | Out-Null
            }
          }
          Restore-Tree "files\api-public" "services\api\public"
          Restore-Tree "files\api-storage" "services\api\storage"
          Restore-Tree "files\uploads" "uploads"
          Write-Host "Folders ready[span_40](start_span)"[span_40](end_span)

      - name: Step 1 - PostgreSQL[span_41](start_span)[span_41](end_span)
        shell: powershell[span_42](start_span)[span_42](end_span)
        run: |
          $pgRoot = "C:\Program Files\PostgreSQL\15"
          $pgBin = Join-Path $pgRoot "bin"
          $pgData = Join-Path $pgRoot "data"

          if ("${{ steps.pg-cache.outputs.cache-hit }}" -ne "true") {
            Write-Host "Cache miss - Chocolatey install (one time)"
            choco install postgresql15 --params "/Password:postgres" -y --no-progress
          } else {
            Write-Host "PostgreSQL cache hit"
          }

          if (-not (Test-Path (Join-Path $pgBin "pg_ctl.exe"))) {
            throw "PostgreSQL missing"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $pgBin
          $env:Path = "$pgBin;" + $env:Path

          $svc = Get-Service -Name "postgresql*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($svc) {
            if ($svc.Status -ne "Running") { Start-Service $svc.Name }
          } else {
            if (-not (Test-Path $pgData)) {
              & "$pgBin\initdb.exe" -D $pgData -U postgres --auth=trust --encoding=UTF8
            }
            & "$pgBin\pg_ctl.exe" -D $pgData -l (Join-Path $pgRoot "pg.log") start
          }

          $ready = $false
          for ($i = 0; $i -lt 40; $i++) {
            & "$pgBin\pg_isready.exe" -h 127.0.0.1 -U postgres | Out-Null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { throw "PostgreSQL did not become ready" }

          & "$pgBin\createdb.exe" -U postgres -h 127.0.0.1 ecsrev
          Write-Host "PostgreSQL ready[span_43](start_span)"[span_43](end_span)

      - name: Redis[span_44](start_span)[span_44](end_span)
        shell: powershell[span_45](start_span)[span_45](end_span)
        run: |
          choco install memurai-developer -y --no-progress
          $m = Get-Command memurai.exe -ErrorAction SilentlyContinue
          if ($m) { Start-Process $m.Source; Write-Host "Memurai started" }
          else {
            $r = Get-Command redis-server.exe -ErrorAction SilentlyContinue
            if ($r) { Start-Process $r.Source; Write-Host "redis-server started" }
            else { Write-Host "WARNING: Redis not found" }
          }[span_46](start_span)[span_46](end_span)

      - name: Restore database dump if present[span_47](start_span)[span_47](end_span)
        shell: powershell[span_48](start_span)[span_48](end_span)
        run: |
          $dump = Join-Path $env:DATA_DIR "ecsrev.dump"
          $sql  = Join-Path $env:DATA_DIR "ecsrev.sql"
          if (Test-Path $dump) {
            Write-Host "Restoring dump"
            & pg_restore -h 127.0.0.1 -U postgres -d ecsrev --clean --if-exists --no-owner --no-acl $dump
          } elseif (Test-Path $sql) {
            Write-Host "Restoring sql"
            & psql -h 127.0.0.1 -U postgres -d ecsrev -f $sql
          } else {
            Write-Host "No previous dump - fresh database"
          }[span_49](start_span)[span_49](end_span)

      - name: Step 1 - services/api/config.json[span_50](start_span)[span_50](end_span)
        shell: powershell[span_51](start_span)[span_51](end_span)
        working-directory: ./services/api[span_52](start_span)[span_52](end_span)
        run: |
          Set-Content -Path "config.json" -Value '{"knex":{"client":"pg","connection":{"host":"127.0.0.1","user":"postgres","password":"postgres","database":"ecsrev"}}}[span_53](start_span)'[span_53](end_span)

      - name: Step 2 - npm i + knex migrate[span_54](start_span)[span_54](end_span)
        shell: powershell[span_55](start_span)[span_55](end_span)
        working-directory: ./services/api[span_56](start_span)[span_56](end_span)
        run: |
          npm install --no-audit --no-fund
          npx knex migrate:latest
          & psql -h 127.0.0.1 -U postgres -d ecsrev -c "\dt[span_57](start_span)"[span_57](end_span)

      - name: Step 3 - appsettings.json from official example[span_58](start_span)[span_58](end_span)
        shell: powershell[span_59](start_span)[span_59](end_span)
        working-directory: ./services/Roblox/Roblox.Website[span_60](start_span)[span_60](end_span)
        run: |
          $root = $env:GITHUB_WORKSPACE.Replace('\','\\')
          @"
          {
            "Urls": "http://127.0.0.1:5000",
            "Logging": { "LogLevel": { "Default": "Warning", "Microsoft.AspNetCore": "Warning" } },
            "Twitter": { "ApiKey": "x", "ApiKeySecret": "x", "Bearer": "x" },
            "PackageShirtAssetId": -1,
            "PackagePantsAssetId": -1,
            "PackageLeftArmAssetId": -1,
            "PackageRightArmAssetId": -1,
