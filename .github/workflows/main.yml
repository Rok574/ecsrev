name: Host ECSRev on Windows with Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: ecsrev-host
  cancel-in-progress: true

jobs:
  host-ecsrev:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ecsrev
      PGHOST: 127.0.0.1
      DATA_DIR: .ecsrev-data
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ASPNETCORE_URLS: http://127.0.0.1:5000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Require admin password secret
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ADMIN_PASSWORD)) {
            throw "Secret ADMIN_PASSWORD is missing. Add it under Repo Settings > Secrets and variables > Actions."
          }
          Write-Host "ADMIN_PASSWORD secret is set."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.18'

      - name: Restore persisted data cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: .ecsrev-data
          key: ecsrev-data-v1-${{ github.run_id }}
          restore-keys: |
            ecsrev-data-v1-

      - name: Create required directories and restore files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:DATA_DIR | Out-Null

          $dirs = @(
            "services\api\public",
            "services\api\public\images",
            "services\api\public\images\thumbnails",
            "services\api\public\UnsecuredContent",
            "services\api\public\assets",
            "services\Roblox\Roblox.Website\wwwroot",
            "services\Roblox\Roblox.Website\wwwroot\images",
            "storage",
            "uploads"
          )
          foreach ($d in $dirs) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
          }

          function Restore-Tree($fromRel, $toRel) {
            $from = Join-Path $env:DATA_DIR $fromRel
            if (Test-Path $from) {
              New-Item -ItemType Directory -Force -Path $toRel | Out-Null
              Write-Host "Restoring $fromRel -> $toRel"
              & robocopy $from $toRel /E /NFL /NDL /NJH /NJS /nc /ns /np | Out-Null
            }
          }

          Restore-Tree "files\api-public" "services\api\public"
          Restore-Tree "files\wwwroot" "services\Roblox\Roblox.Website\wwwroot"
          Restore-Tree "files\storage" "storage"
          Restore-Tree "files\uploads" "uploads"

          if (Test-Path "$env:DATA_DIR\public") {
            Write-Host "Restoring legacy public snapshot"
            & robocopy "$env:DATA_DIR\public" "services\api\public" /E /NFL /NDL /NJH /NJS /nc /ns /np | Out-Null
          }

          Write-Host "File restore done"

      - name: Install PostgreSQL
        shell: powershell
        run: |
          choco install postgresql15 --params "/Password:postgres" -y --no-progress
          $pgBin = "C:\Program Files\PostgreSQL\15\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $pgBin
          $env:Path = "$pgBin;" + $env:Path

          $svc = Get-Service -Name "postgresql*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($svc -and $svc.Status -ne "Running") {
            Start-Service $svc.Name
          }

          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            & "$pgBin\pg_isready.exe" -h 127.0.0.1 -U postgres | Out-Null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { throw "PostgreSQL did not become ready" }

          & "$pgBin\createdb.exe" -U postgres -h 127.0.0.1 ecsrev
          if ($LASTEXITCODE -ne 0) {
            Write-Host "createdb returned $LASTEXITCODE (database may already exist)"
          }
          Write-Host "PostgreSQL ready"

      - name: Restore database dump if present
        shell: powershell
        run: |
          $dump = Join-Path $env:DATA_DIR "ecsrev.dump"
          $sql  = Join-Path $env:DATA_DIR "ecsrev.sql"
          if (Test-Path $dump) {
            Write-Host "Restoring custom dump..."
            & pg_restore -h 127.0.0.1 -U postgres -d ecsrev --clean --if-exists --no-owner --no-acl $dump
            Write-Host "pg_restore exit code: $LASTEXITCODE"
          } elseif (Test-Path $sql) {
            Write-Host "Restoring SQL dump..."
            & psql -h 127.0.0.1 -U postgres -d ecsrev -f $sql
            Write-Host "psql exit code: $LASTEXITCODE"
          } else {
            Write-Host "No previous dump found - fresh database"
          }

      - name: Configure API
        shell: powershell
        working-directory: ./services/api
        run: |
          Set-Content -Path "config.json" -Value '{"knex":{"client":"pg","connection":{"host":"127.0.0.1","user":"postgres","password":"postgres","database":"ecsrev"}}}'

      - name: Install API deps + migrate
        shell: powershell
        working-directory: ./services/api
        run: |
          npm install --no-audit --no-fund
          npx knex migrate:latest

      - name: Configure Website appsettings
        shell: powershell
        working-directory: ./services/Roblox/Roblox.Website
        run: |
          $appsettings = @'
          {
            "Logging": { "LogLevel": { "Default": "Information", "Microsoft.AspNetCore": "Warning" } },
            "AllowedHosts": "*",
            "ConnectionStrings": {
              "DefaultConnection": "Host=127.0.0.1;Database=ecsrev;Username=postgres;Password=postgres"
            },
            "OwnerUserId": 1
          }
          '@
          Set-Content -Path "appsettings.json" -Value $appsettings

      - name: Enable Auto-Accept in ApplicationProcessorService
        shell: powershell
        run: |
          $file = "services\Roblox\Roblox.Services\Users\ApplicationProcessorService.cs"
          if (Test-Path $file) {
            $content = Get-Content $file -Raw
            $patched = $content -replace "autoAccept\s*=\s*false", "autoAccept = true"
            if ($patched -eq $content) {
              $patched = $content -replace "AutoAccept\s*=\s*false", "AutoAccept = true"
            }
            Set-Content -Path $file -Value $patched -NoNewline
            Write-Host "Patched ApplicationProcessorService.cs"
          } else {
            Write-Host "File not found, skipping patch."
          }

      - name: Build Admin Panel
        shell: powershell
        working-directory: ./services/admin
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Seed admin only if missing
        shell: powershell
        run: |
          npm install pg bcryptjs --no-audit --no-fund
          $seedJs = Join-Path $env:RUNNER_TEMP "seed-admin.js"
          @'
          const { Client } = require("pg");
          const bcrypt = require("bcryptjs");
          (async () => {
            const raw = process.env.ADMIN_PASSWORD;
            if (!raw) throw new Error("ADMIN_PASSWORD env is empty");
            const client = new Client({
              host: "127.0.0.1",
              user: "postgres",
              password: "postgres",
              database: "ecsrev"
            });
            await client.connect();
            const hashed = await bcrypt.hash(raw, 10);
            await client.query(
              "INSERT INTO \"Users\" (id, username, password, is_admin, created_at, updated_at) VALUES (1, 'Skylight', $1, true, NOW(), NOW()) ON CONFLICT (id) DO UPDATE SET username = 'Skylight', password = $1, is_admin = true",
              [hashed]
            );
            await client.query(
              "INSERT INTO \"Users\" (id, username, password, is_admin, created_at, updated_at) VALUES (2, 'UGC', NULL, false, NOW(), NOW()) ON CONFLICT (id) DO NOTHING"
            );
            await client.query(
              "INSERT INTO \"Users\" (id, username, password, is_admin, is_banned, created_at, updated_at) VALUES (12, 'BadDecisions', 'banned', false, true, NOW(), NOW()) ON CONFLICT (id) DO NOTHING"
            );
            console.log("Seed complete");
            await client.end();
          })().catch((e) => {
            console.error(e);
            process.exit(1);
          });
          '@ | Set-Content -Path $seedJs -Encoding utf8
          node $seedJs

      - name: Start background data saver
        shell: powershell
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP "save-data.ps1"
          @'
          $ErrorActionPreference = "Continue"
          $root = $env:GITHUB_WORKSPACE
          $dataDir = Join-Path $root ".ecsrev-data"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null

          $trees = @(
            @{ From = "services\api\public"; To = "files\api-public" },
            @{ From = "services\Roblox\Roblox.Website\wwwroot"; To = "files\wwwroot" },
            @{ From = "storage"; To = "files\storage" },
            @{ From = "uploads"; To = "files\uploads" }
          )

          function Save-Tree($fromRel, $toRel) {
            $from = Join-Path $root $fromRel
            $to = Join-Path $dataDir $toRel
            if (Test-Path $from) {
              New-Item -ItemType Directory -Force -Path $to | Out-Null
              & robocopy $from $to /MIR /NFL /NDL /NJH /NJS /nc /ns /np | Out-Null
            }
          }

          function Save-All {
            try {
              & pg_dump -h 127.0.0.1 -U postgres -d ecsrev -Fc -f (Join-Path $dataDir "ecsrev.dump")
              & pg_dump -h 127.0.0.1 -U postgres -d ecsrev -f (Join-Path $dataDir "ecsrev.sql")
              foreach ($t in $trees) { Save-Tree $t.From $t.To }
              Get-Date -Format o | Set-Content (Join-Path $dataDir "last-save.txt")
              Write-Host "DB + images/files snapshot saved"
            } catch {
              Write-Host "Snapshot failed"
            }
          }
          Save-All
          while ($true) {
            Start-Sleep -Seconds 120
            Save-All
          }
          '@ | Set-Content -Path $scriptPath -Encoding ascii
          Start-Process -FilePath "powershell.exe" -ArgumentList "-NoProfile","-ExecutionPolicy","Bypass","-File",$scriptPath -WindowStyle Hidden
          Write-Host "Background saver started (every 2 minutes)"

      - name: Start Native RCCService
        shell: powershell
        working-directory: ./services/RCCService
        run: |
          if (Test-Path "RCCService.exe") {
            Start-Process -FilePath ".\RCCService.exe" -ArgumentList "-console","-placeid:1818"
            Write-Host "RCCService started"
          } else {
            Write-Host "RCCService.exe not found, skipping"
          }

      - name: Start Asset Validation Service (Go)
        shell: powershell
        working-directory: ./services/AssetValidationServiceV2
        run: |
          if (Test-Path "main.go") {
            Start-Process -FilePath "go" -ArgumentList "run","main.go"
            Write-Host "AssetValidationService started"
          } else {
            Write-Host "AssetValidationServiceV2/main.go not found, skipping"
          }

      - name: Start .NET Website
        shell: powershell
        working-directory: ./services/Roblox/Roblox.Website
        run: |
          $env:ASPNETCORE_URLS = "http://127.0.0.1:5000"
          Start-Process -FilePath "dotnet" -ArgumentList "run"
          $up = $false
          for ($i = 0; $i -lt 45; $i++) {
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:5000" -UseBasicParsing -TimeoutSec 2 | Out-Null
              $up = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if ($up) { Write-Host "Website is up on :5000" } else { Write-Host "Website may still be starting..." }

      - name: Install cloudflared
        shell: powershell
        run: choco install cloudflared -y --no-progress

      - name: Persist data artifact (pre-tunnel snapshot)
        uses: actions/upload-artifact@v4
        with:
          name: ecsrev-data
          path: .ecsrev-data
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Cloudflared Tunnel
        shell: powershell
        run: |
          Write-Host "ECSRev is starting. Watch for a trycloudflare.com URL"
          Write-Host "Data snapshots every 2 minutes into .ecsrev-data"
          cloudflared tunnel --url http://127.0.0.1:5000
