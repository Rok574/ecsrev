      - name: Install cloudflared[span_93](start_span)[span_93](end_span)
        shell: powershell[span_94](start_span)[span_94](end_span)
        run: choco install cloudflared -y --no-progress[span_95](start_span)[span_95](end_span)

      - name: Persist data artifact[span_96](start_span)[span_96](end_span)
        uses: actions/upload-artifact@v4[span_97](start_span)[span_97](end_span)
        with:
          name: ecsrev-data[span_98](start_span)[span_98](end_span)
