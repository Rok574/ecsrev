            "Directories": {
              "Storage": "$root\\services\\api\\storage\\",
              "Asset": "$root\\services\\api\\storage\\asset\\",
              "Public": "$root\\services\\api\\public\\",
              "Thumbnails": "$root\\services\\api\\public\\images\\thumbnails\\",
              "GroupIcons": "$root\\services\\api\\public\\images\\groups\\",
              "XmlTemplates": "$root\\services\\Roblox\\Roblox.Libraries\\Templates\\",
              "JsonData": "$root\\services\\Roblox\\Roblox.Libraries\\Json\\",
              "AdminBundle": "$root\\services\\admin\\public\\",
              "EconomyChatBundle": "$root\\services\\economy-chat\\build\\"
            },
            "Jwt": { "Sessions": "gha-jwt-sessions-key-change-me-please-32ch" },
            "AllowedHosts": "*"
          }
          "@ | Set-Content -Path "appsettings.json"
          Write-Host "appsettings.json written with Windows paths[span_61](start_span)"[span_61](end_span)

      - name: Auto-accept applications (docs step 6)[span_62](start_span)[span_62](end_span)
        shell: powershell[span_63](start_span)[span_63](end_span)
        run: |
          $file = "services\Roblox\Roblox.Services\Users\ApplicationProcessorService.cs"
          if (Test-Path $file) {
            $content = Get-Content $file -Raw
            $patched = $content -replace "autoAccept\s*=\s*false", "autoAccept = true"
            if ($patched -eq $content) {
              $patched = $content -replace "AutoAccept\s*=\s*false", "AutoAccept = true"
            }
            Set-Content -Path $file -Value $patched -NoNewline
            Write-Host "Patched ApplicationProcessorService.cs"
          } else {
            Write-Host "ApplicationProcessorService.cs not found"
          }[span_64](start_span)[span_64](end_span)

      - name: Step 5 - build admin panel[span_65](start_span)[span_65](end_span)
        shell: powershell[span_66](start_span)[span_66](end_span)
        working-directory: ./services/admin[span_67](start_span)[span_67](end_span)
        run: |
          npm install --no-audit --no-fund
          npm run build[span_68](start_span)[span_68](end_span)

      - name: Step 6 - build frontend (2016-roblox-main)[span_69](start_span)[span_69](end_span)
        shell: powershell[span_70](start_span)[span_70](end_span)
        run: |
          $front = $null
          foreach ($c in @(
            "services\2016-roblox-main",
            "services\2016-roblox-main\docs",
            "2016-roblox-main"
          )) {
            if (Test-Path (Join-Path $c "package.json")) { $front = $c; break }
          }
          if (-not $front) {
            Write-Host "Frontend folder not found - skip"
            return
          }
          Write-Host "Building frontend in $front"
          Push-Location $front
          if (-not (Test-Path "config.json")) {
            if (Test-Path "util\create_config.js") {
              node .\util\create_config.js
            }
          }
          if (-not (Test-Path "config.json")) {
            Set-Content -Path "config.json" -Value '{"serverRuntimeConfig":{"backend":{"csrfKey":"gha-frontend-csrf-key"}},"publicRuntimeConfig":{"backend":{"proxyEnabled":true,"flags":{"myAccountPage2016Enabled":true,"catalogGenreFilterSupported":true,"catalogPageLimit":28,"catalogSaleCountVisibleFromDetailsEndpoint":true,"catalogDetailsPageResellerLimit":10,"avatarPageInventoryLimit":10},"baseUrl":"http://127.0.0.1:5000","apiFormat":"http://127.0.0.1:5000{1}"}}}'
          }
          npm install --no-audit --no-fund
          npm run build
          Start-Process -FilePath "npm" -ArgumentList "run","start"
          Pop-Location[span_71](start_span)[span_71](end_span)

      - name: Seed ROBLOX + UGC + BadDecisions into user table[span_72](start_span)[span_72](end_span)
        shell: powershell[span_73](start_span)[span_73](end_span)
        run: |
          npm install pg bcryptjs --no-audit --no-fund
          $seedJs = Join-Path $env:GITHUB_WORKSPACE "seed-admin.js"
          @'
          const { Client } = require("pg");
          const bcrypt = require("bcryptjs");
          (async () => {
            const raw = process.env.ADMIN_PASSWORD;
            if (!raw) throw new Error("ADMIN_PASSWORD env is empty");
            const client = new Client({
              host: "127.0.0.1",
              user: "postgres",
              password: "postgres",
              database: "ecsrev"
            });
            await client.connect();
            const hashed = await bcrypt.hash(raw, 10);
            const tables = await client.query("SELECT tablename FROM pg_tables WHERE schemaname='public' AND tablename='user'");
            if (tables.rowCount === 0) throw new Error("Table user is missing - knex migrate did not run");
            await client.query(
              "INSERT INTO \"user\" (id, username, password, status, created_at, online_at) VALUES (1, 'ROBLOX', $1, 1, NOW(), NOW()) ON CONFLICT (id) DO UPDATE SET username = EXCLUDED.username, password = EXCLUDED.password",
              [hashed]
            );
            await client.query(
              "INSERT INTO \"user\" (id, username, password, status, created_at, online_at) VALUES (2, 'UGC', $1, 1, NOW(), NOW()) ON CONFLICT (id) DO NOTHING",
              [hashed]
            );
            await client.query(
              "INSERT INTO \"user\" (id, username, password, status, created_at, online_at) VALUES (12, 'BadDecisions', $1, 3, NOW(), NOW()) ON CONFLICT (id) DO NOTHING",
              [hashed]
            );
            await client.query("SELECT setval(pg_get_serial_sequence('user','id'), GREATEST((SELECT MAX(id) FROM \"user\"), 1))");
            console.log("Seeded ROBLOX (1), UGC (2), BadDecisions (12)");
            await client.end();
          })().catch((e) => { console.error(e); process.exit(1); });
          '@ | Set-Content -Path $seedJs -Encoding utf8
          node $seedJs[span_74](start_span)[span_74](end_span)

      - name: Start background data saver[span_75](start_span)[span_75](end_span)
        shell: powershell[span_76](start_span)[span_76](end_span)
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP "save-data.ps1"
          @'
          $ErrorActionPreference = "Continue"
          $root = $env:GITHUB_WORKSPACE
          $dataDir = Join-Path $root ".ecsrev-data"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $trees = @(
            @{ From = "services\api\public"; To = "files\api-public" },
            @{ From = "services\api\storage"; To = "files\api-storage" }
          )
          function Save-Tree($fromRel, $toRel) {
            $from = Join-Path $root $fromRel
            $to = Join-Path $dataDir $toRel
            if (Test-Path $from) {
              New-Item -ItemType Directory -Force -Path $to | Out-Null
              & robocopy $from $to /MIR /NFL /NDL /NJH /NJS /nc /ns /np | Out-Null
            }
          }
          function Save-All {
            try {
              & pg_dump -h 127.0.0.1 -U postgres -d ecsrev -Fc -f (Join-Path $dataDir "ecsrev.dump")
              & pg_dump -h 127.0.0.1 -U postgres -d ecsrev -f (Join-Path $dataDir "ecsrev.sql")
              foreach ($t in $trees) { Save-Tree $t.From $t.To }
              Get-Date -Format o | Set-Content (Join-Path $dataDir "last-save.txt")
              Write-Host "snapshot saved"
            } catch { Write-Host "snapshot failed" }
          }
          Save-All
          while ($true) { Start-Sleep -Seconds 120; Save-All }
          '@ | Set-Content -Path $scriptPath -Encoding ascii
          Start-Process powershell.exe -ArgumentList "-NoProfile","-ExecutionPolicy","Bypass","-File",$scriptPath -WindowStyle Hidden[span_77](start_span)[span_77](end_span)

